<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stf-Puzzle Simplified Version</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/puzzle.css" rel="stylesheet">
</head>
<body>
<div class="container py-4 text-center">

    <h2 class="mb-3">Stf-Puzzle Simplified Version</h2>

    <!-- Panel de configuracion (como la figura del enunciado) -->
    <div class="panel mx-auto">
        <img id="preview" class="preview" alt="Personaje">

        <div class="d-flex gap-2 justify-content-center my-2">
            <!-- Color del tablero (casilla vacia) -->
            <input type="color" id="color" class="form-control form-control-color" title="Color del tablero">
            <!-- Particiones del tablero, formato NxN -->
            <input type="text" id="dimension" class="form-control" placeholder="3x3" maxlength="3" autocomplete="off">
        </div>
        <small id="errorDimension" class="text-danger d-block mb-2">
            Ingrese la dimensión del tablero en formato NxN (ej. 3x3)
        </small>

        <!-- input file oculto: lo abre el boton "Seleccionar Personaje" -->
        <input type="file" id="archivo" accept=".jpg,.jpeg,image/jpeg" hidden>
        <button type="button" id="btnPersonaje" class="btn btn-success">Seleccionar Personaje</button>
    </div>

    <!-- Solo aparece si la dimension es valida -->
    <button type="button" id="btnIniciar" class="btn btn-success mt-3">Iniciar el juego</button>

    <div id="tablero" class="tablero mx-auto mt-3"></div>
    <p id="mensaje" class="fw-bold mt-2"></p>

</div>

<!-- jQuery 3 (clase 10.3): la libreria SIEMPRE antes del codigo que la usa -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/puzzle.js"></script>
</body>
</html>
